name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Shared catalog and pricing copies are in sync
        run: python tools/sync_shared.py --check
      - name: Unit tests
        run: python -m pytest -q
      - name: Agent YAML is valid
        run: python tools/validate_agent.py agent/
